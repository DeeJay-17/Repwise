name: mobile

on:
  pull_request:
    paths: ["apps/mobile/**", "packages/contracts/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/contracts/**", ".github/workflows/mobile.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: API types match the AI service contract
        run: npm run api:generate && git diff --exit-code src/api/ai-service.generated.ts
      - name: Test
        run: npm test -- --ci
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir dist
