name: core-api

on:
  pull_request:
    paths: ["services/core-api/**", ".github/workflows/core-api.yml", ".github/workflows/_python-service.yml"]
  push:
    branches: [main]
    paths: ["services/core-api/**", ".github/workflows/core-api.yml", ".github/workflows/_python-service.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_python-service.yml
    with:
      path: services/core-api
