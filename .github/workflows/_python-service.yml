# Shared steps for a Python service. Called by core-api.yml and ai-service.yml.
name: python-service

on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ inputs.path }}/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.path }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
