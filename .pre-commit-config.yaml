# Install once: `uvx pre-commit install`. Runs on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^services/
      - id: ruff-format
        files: ^services/

  - repo: local
    hooks:
      - id: mobile-lint
        name: mobile lint
        entry: bash -c 'cd apps/mobile && npm run lint'
        language: system
        files: ^apps/mobile/.*\.(ts|tsx|js)$
        pass_filenames: false
