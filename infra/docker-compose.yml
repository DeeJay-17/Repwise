# Runs the whole backend locally. From the repo root:
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
# core-api: http://localhost:8001/health   ai-service: http://localhost:8002/health

name: repwise

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: ../services/core-api
    environment:
      CORE_API_DATABASE_URL: ${CORE_API_DATABASE_URL}
      CORE_API_LOG_LEVEL: ${CORE_API_LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    build: ../services/ai-service
    environment:
      AI_SERVICE_LOG_LEVEL: ${AI_SERVICE_LOG_LEVEL:-INFO}
    ports:
      - "8002:8000"

volumes:
  db-data:
