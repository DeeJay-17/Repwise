# Database migrations. The URL comes from CORE_API_DATABASE_URL (see app/config.py).
#   uv run alembic upgrade head                       apply all migrations
#   uv run alembic revision --autogenerate -m "..."   after changing app/db/schema.py
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
